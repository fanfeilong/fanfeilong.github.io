<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="灰库，Fan Feilong 的个人知识收藏。按分类浏览资料、搜索书目、在线阅读 PDF，收藏并接续阅读进度。">
  <meta name="theme-color" content="#f3f5f2">
  <title>灰库 · Fan Feilong</title>
  <link rel="icon" href="books/book-manager/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="books/book-manager/style.css">
</head>
<body data-zs-ui="functional-shell" data-zs-shell-version="v2" data-zs-theme="platform">
  <a href="#page-title" class="skip-link">跳到书目</a>
  <noscript>灰库需要 JavaScript。你也可以<a href="books/分类索引.md">查看分类索引</a>。</noscript>
  <div class="shell">
    <aside class="sidebar" id="sidebar">
      <a class="brand" href="./" aria-current="page"><span class="brand-mark" aria-hidden="true">▥</span><div><strong>灰库</strong><small>HUI LIBRARY</small></div></a>
      <div class="side-label">工作台</div>
      <nav class="main-nav" aria-label="主导航">
        <button class="nav-item active" data-view="all"><span aria-hidden="true">▦</span> 全部书籍 <b id="all-count">0</b></button>
        <button class="nav-item" data-view="recent"><span aria-hidden="true">◷</span> 最近阅读</button>
        <button class="nav-item" data-view="favorites"><span aria-hidden="true">☆</span> 我的收藏</button>
      </nav>
      <div class="side-label category-label">分类目录 <span id="category-total"></span></div>
      <nav id="category-nav" class="category-nav" aria-label="书籍分类"></nav>
      <div class="sidebar-foot"><span class="status-dot"></span> 在线灰库 <span id="file-total">正在加载</span></div>
    </aside>

    <div class="workspace">
      <header class="topbar">
        <button class="mobile-menu icon-button" id="menu-button" aria-controls="sidebar" aria-expanded="false" aria-label="打开分类菜单">☰</button>
        <div class="breadcrumb"><a href="./">灰库</a> <span>/</span> <strong id="breadcrumb-current">全部书籍</strong></div>
        <div class="topbar-right">
          <span class="local-badge"><i></i> 在线阅读</span>
          <nav class="site-links" aria-label="个人链接">
            <a href="https://www.cnblogs.com/math/" target="_blank" rel="noopener noreferrer">博客园 ↗</a>
            <a href="https://zhuanlan.zhihu.com/huanhuilong" target="_blank" rel="noopener noreferrer">知乎 ↗</a>
            <a href="https://github.com/fanfeilong/f3" target="_blank" rel="noopener noreferrer">笔记 ↗</a>
            <a href="https://xijiajia.blogspot.com" target="_blank" rel="noopener noreferrer">随笔 ↗</a>
            <a href="https://github.com/fanfeilong" target="_blank" rel="noopener noreferrer">GitHub ↗</a>
          </nav>
        </div>
      </header>

      <main class="content">
        <h1 id="page-title" class="visually-hidden" tabindex="-1">全部书籍</h1>

        <section id="resource-error" class="resource-message" role="status" hidden><h2 id="resource-error-title">资源已不可用</h2><p id="resource-error-text"></p><a id="resource-original" hidden>打开原文件</a><a href="./">返回灰库</a></section>
        <section class="library-panel">
          <div class="panel-heading"><div><h2 id="section-title">馆藏目录</h2><p id="result-description">浏览书籍资料</p></div><div class="view-switch" role="group" aria-label="显示方式"><button id="grid-button" class="selected" aria-label="网格视图" title="网格视图">▦</button><button id="list-button" aria-label="列表视图" title="列表视图">☷</button></div></div>
          <div class="toolbar"><div class="search-cluster"><label class="search"><span aria-hidden="true">⌕</span><span class="search-label">搜索灰库</span><input aria-label="搜索灰库" id="search-input" type="search" placeholder="搜索书名、分类或文件路径" autocomplete="off"><kbd>⌘ K</kbd></label><div class="summary-inline" role="group" aria-label="灰库概况"><span><strong id="stat-books">0</strong> 文件</span><span><strong id="stat-pdfs">0</strong> PDF</span><span><strong id="stat-categories">0</strong> 分类</span><span><strong id="stat-favorites">0</strong> 收藏</span></div></div><select id="topic-select" aria-label="筛选主题"><option value="">全部主题</option></select><select id="sort-select" aria-label="排序方式"><option value="name">名称 A–Z</option><option value="modified">最近更新</option><option value="size">文件大小</option></select><select id="type-select" aria-label="文件类型"><option value="">全部格式</option><option value="pdf">仅 PDF</option><option value="other">其他格式</option></select></div>
          <div class="results-line"><span id="results-count" role="status">正在加载…</span><span class="results-hint">点击 PDF 即可在此阅读</span></div>
          <div id="book-list" class="book-grid"></div>
          <div id="empty-state" class="empty-state" hidden><div>⌕</div><strong>没有找到相关书籍</strong><p>试试其他关键词或清除筛选条件。</p><button id="clear-filters">清除筛选</button></div>
        </section>
        <footer>在线灰库 · 阅读记录仅存于当前浏览器 · 不同设备不会自动同步</footer>
      </main>
    </div>
  </div>

  <dialog id="reader" class="reader" aria-labelledby="reader-title">
    <div class="reader-header"><button id="reader-back" autofocus class="reader-back" aria-label="返回灰库">← <span>返回灰库</span></button><div class="reader-identity"><h2 id="reader-title"></h2><small id="reader-topic"></small></div><div class="reader-actions"><span id="reader-page-summary" class="reader-page-summary" role="status" aria-label="当前页码">– / –</span><button id="reader-settings-toggle" type="button" popovertarget="reader-settings" aria-controls="reader-settings" aria-expanded="false" aria-label="阅读设置" title="显示或隐藏阅读设置"><svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><path d="M4 6h16M4 12h16M4 18h16"/><path d="M8 3v6M16 9v6M10 15v6"/></svg></button><button id="reader-share" type="button" command="--copy" commandfor="reader-share-link" aria-label="复制当前页阅读链接" title="复制当前页阅读链接" disabled><svg viewBox="0 0 24 24" width="19" height="19" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><path d="M10 13a5 5 0 0 0 7 0l3-3a5 5 0 0 0-7-7l-2 2M14 11a5 5 0 0 0-7 0l-3 3a5 5 0 0 0 7 7l2-2"/></svg></button><a id="reader-download" href="#" download title="下载原文件" aria-label="下载原文件">↓</a><button id="reader-close" aria-label="关闭阅读器">×</button></div></div>
    <span id="reader-share-status" class="reader-share-status" role="status"></span>
    <div id="reader-share-panel" class="reader-share-panel" hidden><label for="reader-share-link">阅读链接（可手动复制）</label><input id="reader-share-link" readonly type="url"><button id="reader-share-done" type="button">完成</button></div>
    <div id="reader-settings" class="reader-settings" popover="manual" role="region" aria-label="阅读设置面板" hidden>
    <div class="reader-toolbar"><div class="pager"><button id="prev-page" aria-label="上一页">‹</button><label><input id="page-input" type="number" min="1" value="1" aria-label="页码"> <span>/ <span id="page-count">–</span></span></label><button id="next-page" aria-label="下一页">›</button></div><div class="zoom"><button id="zoom-out" aria-label="缩小">−</button><span id="zoom-label">适合宽度</span><button id="zoom-in" aria-label="放大">+</button></div><span id="reader-status" role="status"></span></div>
    <div class="reader-options" aria-label="阅读设置">
      <select id="reader-fit" aria-label="适宽方式"><option value="page">整页适宽</option><option value="content">正文适宽</option></select>
      <label class="reader-trim">裁边 <input id="reader-trim" type="range" min="0" max="12" step="1" value="0" aria-label="左右额外裁边百分比"><output id="reader-trim-value" for="reader-trim">0%</output></label>
      <select id="reader-columns" aria-label="分栏阅读"><option value="1">整页阅读</option><option value="2">双栏阅读</option></select>
      <button id="reader-reset" type="button">还原整页</button>
    </div>
    <p id="reader-hint" class="reader-hint">← / ↑ 下一页，→ / ↓ 上一页；双击放大，双指缩放；长页或放大后先浏览，到边缘再翻页</p>
    </div>
    <div class="reader-body">
      <div id="reader-scroll" class="reader-scroll" tabindex="0" role="region" aria-label="PDF 阅读区域" aria-busy="false" aria-describedby="reader-hint"><canvas id="pdf-canvas" aria-label="PDF 页面" hidden></canvas></div>
      <div id="reader-loading" class="reader-loading" hidden><progress class="loading-spinner" aria-label="正在加载 PDF"></progress><span id="reader-loading-text" role="status">正在打开 PDF…</span></div>
    </div>
  </dialog>
  <div id="toast" class="toast" role="status" hidden></div>
  <script type="module" src="books/book-manager/app.js"></script>
</body>
</html>
